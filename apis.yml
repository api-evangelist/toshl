apis:
- name: Toshl API
  description: REST JSON API for the Toshl personal finance platform. Manage
    accounts, entries (expenses and incomes with repeats per RFC 5545, transactions,
    images, locations), budgets, categories, tags, currencies, exports, planning,
    and bank institutions/connections/imports. OAuth 2.0 (authorization code and
    implicit) with per-resource r/rw scopes or personal-token basic auth; versioned
    via the application/vnd.toshl+json media type; Link-header pagination and
    X-RateLimit headers.
  humanURL: https://developer.toshl.com/docs/
