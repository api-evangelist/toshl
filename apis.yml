name: Toshl
description: Toshl Finance is a personal finance and budgeting platform (a 500 Global
  portfolio company, founded in Slovenia) that helps people track expenses, organize
  bills, and budget across mobile and web apps, with bank account connections or
  manual entry. Its Toshl API at api.toshl.com exposes the user's complete
  personal-finance graph - accounts, entries (expenses and incomes), budgets,
  categories, tags, locations, images, currencies, exports, planning, and bank
  institutions/connections/imports - as a REST JSON API with OAuth 2.0
  (per-resource read/read-write scopes) or long-lived personal tokens.
